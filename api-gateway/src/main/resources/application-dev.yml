spring:
  config:
    activate:
      on-profile: dev
  cloud:
    gateway:
      routes:
        - id: user-service-docs
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/v3/api-docs/users
          filters:
            - SetPath=/v3/api-docs
        - id: ride-service-docs
          uri: ${RIDE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/v3/api-docs/rides
          filters:
            - SetPath=/v3/api-docs
        - id: pricing-service-docs
          uri: ${PRICING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/v3/api-docs/pricing
          filters:
            - SetPath=/v3/api-docs
        - id: notification-service-docs
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/v3/api-docs/notifications
          filters:
            - SetPath=/v3/api-docs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: User Service
        url: /v3/api-docs/users
      - name: Ride Service
        url: /v3/api-docs/rides
      - name: Pricing Service
        url: /v3/api-docs/pricing
      - name: Notification Service
        url: /v3/api-docs/notifications

# Local Development JWT Configuration (Allows local runs with --spring.profiles.active=dev)
jwt:
  secret: ${JWT_SECRET:DevOnlyIsolatedJwtSecretMustBeAtLeast32BytesLongForLocalTesting!}
  expiration-ms: 86400000
