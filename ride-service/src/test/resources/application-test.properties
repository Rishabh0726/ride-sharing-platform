spring.application.name=ride-service
server.port=0

# H2 In-Memory Database for Isolated Testing (Never connects to local MySQL)
spring.datasource.url=jdbc:h2:mem:ride_isolated_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Test Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Flyway for isolated unit/slice tests (Hibernate DDL generates tables in H2)
spring.flyway.enabled=false

# Test Feign URLs
pricing-service.url=http://localhost:8083
user-service.url=http://localhost:8081
notification-service.url=http://localhost:8084

# Test JWT Secret (HMAC-SHA256 requires minimum 32 bytes / 256 bits)
jwt.secret=TestSecretKeyForRideServiceTestingMustBeAtLeast32BytesLong!
jwt.expiration-ms=86400000
jwt.internal-token-expiration-ms=900000

# Logging
logging.level.com.rideshare.ride_service=WARN
logging.level.org.springframework.security=WARN
