spring.application.name=ride-service
server.port=8082

# Database Connection (ride_db) - Externalized credentials
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ride_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Service-to-Service Integration URLs
pricing-service.url=${PRICING_SERVICE_URL:http://localhost:8083}
user-service.url=${USER_SERVICE_URL:http://localhost:8081}
notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}

# Feign Client Timeouts (in ms)
feign.client.config.default.connectTimeout=2000
feign.client.config.default.readTimeout=3000
feign.client.config.notification-service.connectTimeout=1000
feign.client.config.notification-service.readTimeout=2000

# JWT Security Configuration - Externalized secret
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
jwt.internal-token-expiration-ms=900000

# Logging
logging.level.com.rideshare.ride_service=INFO
logging.level.org.springframework.security=INFO

# OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Spring Boot Actuator Configuration (Health Checks & Probes)
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
