spring.application.name=user-service

server.port=8081

# Database Configuration (Harmonized with standard Spring Boot environment variables)
# Precedence: SPRING_DATASOURCE_URL > DB_HOST/DB_PORT/DB_NAME; SPRING_DATASOURCE_USERNAME > DB_USERNAME; SPRING_DATASOURCE_PASSWORD > DB_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:user_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate (Validate entity mapping against Flyway schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration (Externalized secret with no fallback)
application.jwt.secret=${JWT_SECRET}
application.jwt.expiration-ms=86400000

# Driver Proximity and Location Configuration
application.driver.location.max-age-seconds=600

# Spring Boot Actuator Configuration (Health Checks & Probes)
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
