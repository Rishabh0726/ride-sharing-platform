# Isolated Test Configuration - In-Memory H2 (Zero Local MySQL Contact)
spring.datasource.url=jdbc:h2:mem:user_isolated_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway disabled in isolated unit/slice tests
spring.flyway.enabled=false

# Test-Only JWT Configuration (Valid 256-bit test secret for unit & slice tests)
application.jwt.secret=isolated_testing_jwt_secret_must_be_minimum_32_bytes_long!
application.jwt.expiration-ms=3600000

# Driver Proximity and Location Configuration
application.driver.location.max-age-seconds=600
